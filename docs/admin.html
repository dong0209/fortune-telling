<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>職運羅盤管理後台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/style.css">
<style>
.admin{max-width:1180px;margin:24px auto 0;display:flex;flex-direction:column;gap:20px}
.admin section{padding:20px 22px}
.admin td{white-space:normal;vertical-align:top}
.admin td.nowrap{white-space:nowrap}
.actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.actions input{width:150px;font-size:12.5px;padding:5px 8px}
.stat{display:flex;gap:12px;flex-wrap:wrap}
.stat div{border:1px solid var(--line);border-radius:3px;padding:8px 14px;background:var(--sunk)}
.stat b{font-family:var(--f-mono);font-size:22px;color:var(--gold-bright);display:block}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<header class="topbar wrap">
  <a class="brand-mini" href="./"><span class="seal" aria-hidden="true">職<br>運</span>職運羅盤・管理後台</a>
  <div id="account"></div>
</header>
<div class="admin" id="adminRoot"><section class="panel-box"><p class="loading">載入中…</p></section></div>
<dialog id="loginDlg" aria-labelledby="loginTitle">
  <div class="dlg-head"><h3 id="loginTitle">管理員登入</h3><button type="button" class="btn-text" data-close>關閉</button></div>
  <form id="loginForm">
    <div class="field"><label for="loginEmail">Email</label><input type="email" id="loginEmail" required autocomplete="email"></div>
    <button class="btn-gold" type="submit">寄送登入連結</button>
    <p class="small" id="loginMsg" role="status"></p>
  </form>
</dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.js"></script>
<script src="assets/config.js"></script>
<script src="assets/api.js"></script>
<script src="assets/sky.js"></script>
<script src="assets/admin.js"></script>
</body>
</html>
