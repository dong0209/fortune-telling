# Supabase 免費專案連續 7 天沒有請求會被暫停，這個排程每天讀一次方案表保持喚醒。
# 網址與公開金鑰直接從 docs/assets/config.js 讀取，不需要另外設定 secrets。
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 1 * * *"   # 每天台灣時間 09:17
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 呼叫 Supabase
        run: |
          url=$(sed -nE 's/.*supabaseUrl: *"([^"]+)".*/\1/p' docs/assets/config.js)
          key=$(sed -nE 's/.*supabaseAnonKey: *"([^"]+)".*/\1/p' docs/assets/config.js)
          test -n "$url" && test -n "$key" || { echo "config.js 尚未填入 supabaseUrl / supabaseAnonKey"; exit 1; }
          curl -fsS -m 30 "$url/rest/v1/plans?select=id" -H "apikey: $key" -o /dev/null
          echo "OK: $url"
